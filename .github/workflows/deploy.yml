name: Deploy DalaTransit to GitHub Pages

on:
  push:
    branches: [ master, main ]
  schedule:
    # Körs automatiskt var 6:e timme (kl 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Gör att du även kan klicka på "Run workflow" manuellt när du vill

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Byt till '9.0.x' om projektet använder .NET 9

      # 1. Kör CLI:et för att hämta realtidsdata och generera wwwroot/data/punctuality.json
      - name: Generate Fresh Punctuality Data
        env:
          ResRobotApiKey: ${{ secrets.RESROBOT_API_KEY }}
        run: |
          dotnet run --project DalaTransit.Cli -- --export

      # 2. Skapa appsettings.json med API-nyckel för frontend
      - name: Inject API Key into appsettings.json
        run: |
          echo "{\"ResRobotApiKey\": \"${{ secrets.RESROBOT_API_KEY }}\"}" > DalaTransit/wwwroot/appsettings.json

      # 3. Bygg Blazor WebAssembly-appen (inklusive den nygenererade punctuality.json)
      - name: Publish Blazor WebAssembly
        run: dotnet publish DalaTransit/DalaTransit.csproj -c Release -o output

      # 4. Fixa SPA routing för GitHub Pages (kopiera index.html till 404.html)
      - name: Fix SPA Routing for GitHub Pages
        run: cp output/wwwroot/index.html output/wwwroot/404.html

      # 5. Fixa base href för undermappen /DalaTransit/
      - name: Rewrite base href
        run: sed -i 's/<base href="\/" \/>/<base href="\/DalaTransit\/" \/>/g' output/wwwroot/index.html

      # 6. Ladda upp till GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4