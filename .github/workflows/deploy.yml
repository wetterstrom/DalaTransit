name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WebAssembly
        run: dotnet publish DalaTransit/DalaTransit.csproj -c Release -o release --nologo

      - name: Inject ResRobot API Key into Published Output
        env:
          API_KEY: ${{ secrets.RESROBOT_API_KEY }}
        run: |
          echo "{\"ResRobotApiKey\": \"$API_KEY\"}" > release/wwwroot/appsettings.json

      - name: Change base tag in index.html
        run: sed -i 's/<base href="\/" \/>/<base href="\/DalaTransit\/" \/>/g' release/wwwroot/index.html

      - name: Fix SPA 404 routing & disable Jekyll
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4